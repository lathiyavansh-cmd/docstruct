# What this file does
#   Render "Blueprint": describes the DocStruct web service so Render can create and deploy it in one step.
#
# How it works
#   - One free Docker web service in Singapore, built from the Dockerfile, health-checked at /api/health.
#   - The database is a Supabase PostgreSQL project: paste its connection string into DATABASE_URL when Render asks.
#   - Uploaded files are kept in that database (STORAGE_DRIVER=database), because Render's free disk is wiped on restart.
#   - SIGNING_SECRET is generated by Render; SEED_DEMO loads the demo accounts on the first start.
#
# Where it fits
#   Render reads this file from the repository (New > Blueprint). Module: repository and deployment (owner: Vansh).

services:
  - type: web
    name: docstruct
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SIGNING_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: database
      - key: SEED_DEMO
        value: "true"
      - key: EXTRACTOR
        value: python
      - key: PYTHON_BIN
        value: python3
      - key: DB_POOL_MAX
        value: "5"
