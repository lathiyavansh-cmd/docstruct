<!doctype html>
<!--
  What this file does
    The single HTML page of the web client. React draws the whole app inside it.

  Why it exists
    In production the API server sends this same page for every page URL, so React Router (not the
    server) picks the screen, including public share links. Vite also needs it as the starting point
    of the build: the script tag here is what pulls in all the app code.

  How it works
    - Sets the character set, mobile viewport, icon and page title.
    - Provides an empty <div id="root"> for React to fill.
    - Loads src/main.tsx, which starts the React app.

  Where it fits
    Served by Vite (vite.config.ts) in development and turned into dist/index.html by the build.
    Module: web client setup (owner: Vansh).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DocStruct</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- type="module" lets the browser load modern ES imports; Vite compiles the .tsx file. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
