# What this file does
#   GitHub Actions workflow that checks every push and pull request to develop and main.
#
# How it works
#   - commit-messages: on pull requests, checks every new commit message.
#   - node: installs packages, then runs typecheck, tests and build.
#   - extractor: installs Python 3.12 and runs the text extractor's unit tests.
#
# Where it fits
#   Run by GitHub on its own servers. Uses scripts/verify-commit-msg.mjs and the npm scripts
#   in package.json. Module: CI (owner: Vansh).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  commit-messages:
    name: Commit message lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Fetch the full history so the base branch is available for the commit range below.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Check only the commits this pull request adds on top of its target branch.
      - run: node scripts/verify-commit-msg.mjs --range "origin/${{ github.base_ref }}..HEAD"

  node:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci installs the exact versions from package-lock.json for a repeatable build.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  extractor:
    name: Python text extractor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/extractor/requirements.txt
      - run: python -m unittest discover -s services/extractor/tests -v
